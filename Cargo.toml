[package]
name = "paypal-ai-hackathon_november-12-2026"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest  = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
