[package]
name = "paypal-ai-hackathon_november-12-2026"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest  = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18.6"
axum = { version = "0.8.9", features = ["macros"] }

uuid = { version = "1.29.1", features= ["v4", "serde"] }

#tower = "0.5.3"
#tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"

#sql connection
sqlx = {
    version = "0.9.0",
    features = [
        "runtime-tokio",
        "postgres",
        "macros",
        "migrate",
        "chrono",
        "uuid"
    ]
}

#date time config
chrono = { version = "0.4.45", features = ["serde"]}